<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lexi — ES ⇄ RU</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#f5f5f7;
--card:#ffffff;
--text:#111111;
--subtle:#8e8e93;
--accent:#111111;
--border:rgba(0,0,0,0.06);
--shadow:0 20px 60px rgba(0,0,0,0.08);
}

[data-theme="dark"]{
--bg:#0f0f12;
--card:#1c1c1f;
--text:#ffffff;
--subtle:#8e8e93;
--accent:#ffffff;
--border:rgba(255,255,255,0.08);
--shadow:0 20px 60px rgba(0,0,0,0.6);
}

*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
background:var(--bg);
color:var(--text);
display:flex;
flex-direction:column;
align-items:center;
padding:40px 16px 80px;
transition:.25s;
}

h1{font-size:18px;font-weight:600;margin-bottom:28px}

.card{
width:100%;
max-width:520px;
min-height:180px;
background:var(--card);
border-radius:32px;
box-shadow:var(--shadow);
display:flex;
align-items:center;
justify-content:center;
padding:40px;
font-size:32px;
text-align:center;
border:1px solid var(--border);
}

.controls{
margin-top:28px;
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

button{
border:none;
border-radius:18px;
padding:12px 18px;
font-size:14px;
font-weight:500;
background:var(--accent);
color:var(--bg);
cursor:pointer;
}

button.secondary{
background:transparent;
color:var(--text);
border:1px solid var(--border);
}

.section{
width:100%;
max-width:520px;
margin-top:40px;
display:none;
}

input{
width:100%;
padding:12px;
border-radius:14px;
border:1px solid var(--border);
margin-bottom:10px;
background:var(--card);
color:var(--text);
}

.preview-card{
background:var(--card);
border-radius:18px;
padding:14px;
margin-bottom:10px;
border:1px solid var(--border);
}

.subtle{font-size:12px;color:var(--subtle);margin-top:8px}
</style>
</head>

<body>

<h1>Lexi</h1>

<div class="card" id="card">Loading...</div>
<div class="subtle" id="progress"></div>

<div class="controls">
<button id="flipBtn">Flip</button>
<button id="nextBtn">Next</button>
<button id="directionBtn" class="secondary">Direction</button>
<button id="themeBtn" class="secondary">Theme</button>
<button id="syncBtn" class="secondary">Sync</button>
<button id="toolsBtn" class="secondary">Tools</button>
</div>

<div class="section" id="tools">

<select id="toolSelector" style="margin-bottom:20px">
<option value="ocr">Image → Cards</option>
<option value="translate">Translate Word</option>
<option value="manual">New Pair</option>
<option value="data">Import / Export</option>
</select>

<div id="tool_ocr" class="toolPanel">
<input type="file" id="imageInput" accept="image/*" />
<button id="ocrBtn">Extract Cards</button>
<div id="ocrPreview"></div>
</div>

<div id="tool_translate" class="toolPanel" style="display:none">
<input id="translateInput" placeholder="Spanish word" />
<button id="translateBtn">Suggest Translation</button>
<div id="translatePreview"></div>
</div>

<div id="tool_manual" class="toolPanel" style="display:none">
<input id="manualES" placeholder="Spanish" />
<input id="manualRU" placeholder="Russian" />
<button id="manualSave">Save Pair</button>
</div>

<div id="tool_data" class="toolPanel" style="display:none">
<button id="exportBtn">Export JSON</button>
<input type="file" id="importInput" accept="application/json" />
<button id="replaceBtn" class="secondary">Import (Replace)</button>
</div>

</div>

<script>

window.addEventListener("DOMContentLoaded",()=>{

/* SUPABASE */

const SUPABASE_URL="https://oundvioyxzyqwqfqfpkt.supabase.co";
const SUPABASE_KEY="sb_publishable_CkfFIL5oAkNj9BMSaOYl6w_1FPy0Rr8";

let client=null;

if(window.supabase){
client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

/* STATE */

let cards=[];
let currentIndex=0;
let showingFront=true;
let direction="es-ru";

const cardEl=document.getElementById("card");
const progressEl=document.getElementById("progress");

function showCard(){

if(cards.length===0){
cardEl.textContent="No cards yet";
progressEl.textContent="";
return;
}

const c=cards[currentIndex];

cardEl.textContent = showingFront
? (direction==="es-ru"?c.es:c.ru)
: (direction==="es-ru"?c.ru:c.es);

progressEl.textContent = cards.length+" cards";

}

function nextCard(){
if(cards.length<2) return;
let i;
do{i=Math.floor(Math.random()*cards.length)}while(i===currentIndex);
currentIndex=i;
showingFront=true;
showCard();
}

function flip(){
showingFront=!showingFront;
showCard();
}

function toggleDirection(){
direction = direction==="es-ru" ? "ru-es" : "es-ru";
nextCard();
}

function addCard(es,ru){
if(!es||!ru) return;
cards.push({es,ru});
currentIndex=cards.length-1;
showingFront=true;
showCard();
}

/* BUTTONS */

document.getElementById("flipBtn").onclick=flip;

document.getElementById("nextBtn").onclick=nextCard;

document.getElementById("directionBtn").onclick=toggleDirection;

/* THEME */

const themeBtn=document.getElementById("themeBtn");

let theme=localStorage.getItem("theme")||"light";

document.documentElement.setAttribute("data-theme",theme);

themeBtn.onclick=()=>{

theme = theme==="light" ? "dark" : "light";

document.documentElement.setAttribute("data-theme",theme);

localStorage.setItem("theme",theme);

};

/* TOOLS */

const tools=document.getElementById("tools");

const toolsBtn=document.getElementById("toolsBtn");

toolsBtn.onclick=()=>{

tools.style.display = tools.style.display==="block" ? "none" : "block";

};

const selector=document.getElementById("toolSelector");

selector.onchange=()=>{

const panels=document.querySelectorAll(".toolPanel");

panels.forEach(p=>p.style.display="none");

const active=document.getElementById("tool_"+selector.value);

if(active) active.style.display="block";

};

/* OCR */

const ocrBtn=document.getElementById("ocrBtn");
const imageInput=document.getElementById("imageInput");
const ocrPreview=document.getElementById("ocrPreview");

ocrBtn.onclick=async()=>{

const file=imageInput.files[0];
if(!file) return;

ocrPreview.innerHTML="Processing...";

try{

const result=await Tesseract.recognize(file,'spa+rus');

const text=result.data.text;

ocrPreview.innerHTML="";

const regex=/([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)\s*[-–—]\s*([A-Za-zА-Яа-яЁё]+)/g;

let m;

while((m=regex.exec(text))!==null){
createPreview(m[1],m[2]);
}

}catch(e){
ocrPreview.innerHTML="OCR failed";
}

};

function createPreview(es,ru){

const div=document.createElement("div");

div.className="preview-card";

div.innerHTML=`
<input value="${es}" class="es" />
<input value="${ru}" class="ru" />
<button class="save">Save</button>
<button class="secondary del">Delete</button>
`;

const save=div.querySelector(".save");
const del=div.querySelector(".del");

save.onclick=()=>{
addCard(div.querySelector(".es").value.trim(),div.querySelector(".ru").value.trim());
div.remove();
};

del.onclick=()=>div.remove();

ocrPreview.appendChild(div);

}

/* TRANSLATE */

const translateBtn=document.getElementById("translateBtn");
const translateInput=document.getElementById("translateInput");
const translatePreview=document.getElementById("translatePreview");

translateBtn.onclick=async()=>{

const word=translateInput.value.trim();

if(!word) return;

translatePreview.innerHTML="Searching...";

try{

const res=await fetch(`https://api.mymemory.translated.net/get?q=${word}&langpair=es|ru`);

const data=await res.json();

translatePreview.innerHTML="";

const ru=data.responseData.translatedText;

createPreview(word,ru);

translatePreview.appendChild(ocrPreview.lastChild);

}catch{

translatePreview.innerHTML="Translation failed";

}

};

/* MANUAL */

const manualSave=document.getElementById("manualSave");

manualSave.onclick=()=>{

const es=document.getElementById("manualES").value.trim();
const ru=document.getElementById("manualRU").value.trim();

addCard(es,ru);

};

/* EXPORT */

const exportBtn=document.getElementById("exportBtn");

exportBtn.onclick=()=>{

const blob=new Blob([JSON.stringify(cards,null,2)],{type:"application/json"});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="cards.json";

a.click();

};

/* IMPORT */

const replaceBtn=document.getElementById("replaceBtn");

replaceBtn.onclick=()=>{

const file=document.getElementById("importInput").files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=e=>{

try{

const data=JSON.parse(e.target.result);

if(Array.isArray(data)){

cards=data.filter(c=>c.es && c.ru);

currentIndex=0;

showCard();

}

}catch{
alert("Invalid JSON");
}

};

reader.readAsText(file);

};

/* SYNC + LIVE SYNC */

const syncBtn=document.getElementById("syncBtn");

function dedupeCards(list){
const map=new Map();
list.forEach(c=>{
const key=(c.es+"|"+c.ru).toLowerCase();
if(!map.has(key)) map.set(key,{es:c.es,ru:c.ru});
});
return Array.from(map.values());
}

let syncing=false;

syncBtn.onclick=async()=>{

if(syncing) return;

if(!client){
alert("Supabase not configured");
return;
}

syncing=true;
syncBtn.disabled=true;
syncBtn.textContent="Syncing...";

cards = dedupeCards(cards);

await client
.from("cards")
.upsert(cards,{ onConflict:"es,ru" });

const {data,error}=await client.from("cards").select("*");

if(!error && data){

cards = dedupeCards(data.map(c=>({es:c.es,ru:c.ru})));

currentIndex=0;
showCard();

}

syncBtn.textContent="Sync";
syncBtn.disabled=false;
syncing=false;

};

/* LIVE SYNC (realtime updates from Supabase) */

if(client){

client
.channel("cards-live")
.on(
"postgres_changes",
{event:"*",schema:"public",table:"cards"},
async()=>{

const {data}=await client.from("cards").select("*");

if(data){

cards = dedupeCards(data.map(c=>({es:c.es,ru:c.ru})));

showCard();

}

}
)
.subscribe();

}

showCard();

});

</script>

</body>
</html>
